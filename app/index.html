<body class="bg-canvas text-ink font-sans antialiased">

  <header class="mx-auto max-w-[980px] px-5 pt-7">
    <h1 class="text-4xl font-black uppercase leading-none tracking-tight sm:text-5xl">My Split</h1>
    <p class="mb-5 mt-1.5 text-sm text-muted">A 5-day rotation — tap any exercise to see the movement, and log your sets as you go.</p>
  </header>

  <nav id="nav" class="mx-auto flex max-w-[980px] gap-1 overflow-x-auto border-b border-line px-5 pb-0.5"></nav>

  <main id="main" class="mx-auto max-w-[980px] px-5 pb-24 pt-6"></main>

  <div id="overlay" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/70 p-5">
    <div id="modal" class="relative w-full max-w-[520px] max-h-[88vh] overflow-y-auto rounded-[20px] bg-white p-5"></div>
  </div>

  <script>
    /* ==================================================================
       Program data — 5-day split. Each exercise's demo gif is loaded
       from ./gifs/<exercise name>.gif (see gifs/README.txt).
       ================================================================== */
    const PROGRAM = [
      {
        id: 'upperA', label: 'Upper A', colorKey: 'upper', subtitle: 'Chest, Back, Triceps',
        exercises: [
          {
            name: 'Flat Barbell Bench Press', target: 'Chest, front delts, triceps', scheme: '3x8-10',
            how: 'Lie on the bench, lower the bar to mid-chest, then press up until your arms are straight.',
            alt: 'No barbell free? Do a Dumbbell Bench Press instead — same movement, a bit more shoulder stability required.'
          },
          {
            name: 'Lat Pulldown', target: 'Back (width)', scheme: '3x10-12',
            how: 'Pull the bar down to your upper chest, squeezing your shoulder blades together, then control it back up.',
            alt: 'No lat pulldown machine? Do assisted, or resistance-band-assisted, pull-ups instead.'
          },
          {
            name: 'Incline Dumbbell Press', target: 'Upper chest', scheme: '3x10-12',
            how: 'On an inclined bench, press the dumbbells up and slightly inward until your arms extend.',
            alt: 'No incline bench? Prop one end of a flat bench on a low step or a couple of plates to angle it yourself.'
          },
          {
            name: 'Seated Cable Row', target: 'Back (thickness)', scheme: '3x10-12',
            how: 'Pull the handle to your stomach, elbows close to your body, and squeeze your back at the end.',
            alt: 'No cable row station? Do bent-over dumbbell rows instead.'
          },
          {
            name: 'Triceps Rope Pushdown', target: 'Triceps', scheme: '3x12-15',
            how: 'Push the rope down until your arms are straight, spreading the rope apart at the bottom.',
            alt: 'No cable rope? Do dumbbell overhead triceps extensions or bench dips instead.'
          },
          {
            name: 'Face Pull', target: 'Rear delts, posture', scheme: '2x15',
            how: 'Pull the rope toward your face with elbows high, focusing on squeezing your shoulder blades.',
            alt: 'No cable station free? Loop a resistance band around a rack at face height and do band pull-aparts.'
          }
        ]
      },
      {
        id: 'lowerA', label: 'Lower A', colorKey: 'lower', subtitle: 'Quad-Dominant',
        exercises: [
          {
            name: 'Barbell Back Squat', target: 'Quads, glutes', scheme: '3x8-10',
            how: 'Bar on your upper back, squat down until your thighs are parallel to the floor, then drive back up.',
            alt: 'No squat rack free? Do Goblet Squats holding one dumbbell at your chest instead.'
          },
          {
            name: 'Romanian Deadlift', target: 'Hamstrings, glutes', scheme: '3x10',
            how: 'Hinge at your hips, lower the bar along your legs while keeping your back flat, and feel the hamstring stretch.',
            alt: 'No barbell free? Use two dumbbells in front of your thighs — same hip-hinge motion.'
          },
          {
            name: 'Walking Lunges', target: 'Quads, glutes, balance', scheme: '3x12/leg',
            how: 'Step forward, drop your back knee toward the floor, then push through your front heel to stand.',
            alt: 'No open floor space? Do stationary reverse lunges in place instead.'
          },
          {
            name: 'Leg Extension (machine)', target: 'Quads isolation', scheme: '2x12-15',
            how: 'Extend your legs fully against the pad, then control the lowering back down.',
            alt: 'No leg extension machine? Add an extra set of squats or lunges — your quads still get worked.'
          },
          {
            name: 'Standing Calf Raise', target: 'Calves', scheme: '3x15',
            how: 'Rise onto your toes as high as possible, pause, then lower slowly.',
            alt: 'No calf raise machine? Stand on the edge of a step holding a rail and raise up on your toes.'
          },
          {
            name: 'Plank', target: 'Core', scheme: '3x30-45s',
            how: 'Hold a straight line from head to heels, forearms on the floor, and brace your abs.',
            alt: 'Bodyweight only — no equipment needed, always doable.'
          }
        ]
      },
      {
        id: 'upperB', label: 'Upper B', colorKey: 'upper', subtitle: 'Shoulders, Back Width, Arms',
        exercises: [
          {
            name: 'Seated Dumbbell Shoulder Press', target: 'Shoulders', scheme: '3x8-10',
            how: 'Press the dumbbells overhead until your arms are straight, then lower to ear level.',
            alt: 'No bench? Do it standing (a standing overhead press) — your core works harder too.'
          },
          {
            name: 'Pull-Ups / Lat Pulldown', target: 'Back width', scheme: '3x8-10',
            how: 'Pull the bar down to your upper chest, squeezing your shoulder blades together, then control it back up.',
            alt: "If you can do pull-ups, do them. If not, use a wide-grip lat pulldown or assisted pull-up variation until you build the strength."
          },
          {
            name: 'Dumbbell Lateral Raise', target: 'Side delts', scheme: '3x12-15',
            how: 'Raise the dumbbells out to your sides to shoulder height, with a slight bend in your elbows.',
            alt: 'No dumbbells free? Use a resistance band anchored under your foot instead.'
          },
          {
            name: 'Bicep Curl (Barbell or Dumbbell)', target: 'Biceps', scheme: '3x10-12',
            how: 'Curl the weight up without swinging, squeeze at the top, then lower slowly.',
            alt: 'Use whichever is free — barbell or dumbbells work the biceps the same way.'
          },
          {
            name: 'Overhead Triceps Extension', target: 'Triceps', scheme: '3x10-12',
            how: 'Hold the weight behind your head, then extend your arms fully overhead.',
            alt: 'No dumbbell free? Use a resistance band anchored behind you, or do close-grip push-ups instead.'
          },
          {
            name: 'Rear Delt Fly', target: 'Rear delts', scheme: '2x15',
            how: 'Bend over and raise the dumbbells out to your sides, squeezing your shoulder blades together.',
            alt: 'No dumbbells free? Use a light resistance band, or just do extra Face Pulls — same muscles.'
          }
        ]
      },
      {
        id: 'lowerB', label: 'Lower B', colorKey: 'lower', subtitle: 'Posterior Chain, Glutes',
        exercises: [
          {
            name: 'Deadlift', target: 'Full posterior chain', scheme: '3x6-8',
            how: 'Hinge down, grip the bar, then drive through your heels and stand tall while keeping your back flat.',
            alt: 'A trap bar (if your gym has one) is easier on the lower back for beginners — a conventional barbell works the same muscles.'
          },
          {
            name: 'Leg Press', target: 'Quads, glutes', scheme: '3x10-12',
            how: 'Push the platform away until your legs are extended, without locking your knees.',
            alt: 'No leg press machine? Do Goblet Squats or Walking Lunges instead.'
          },
          {
            name: 'Bulgarian Split Squat', target: 'Glutes, quads (unilateral)', scheme: '3x10/leg',
            how: 'With your rear foot elevated behind you, lower your front knee until that thigh is parallel to the floor.',
            alt: 'No bench to elevate your rear foot on? Do regular Walking Lunges instead.'
          },
          {
            name: 'Seated Leg Curl', target: 'Hamstrings', scheme: '3x12',
            how: 'Curl the pad toward your glutes, then control the release.',
            alt: 'No leg curl machine? Try stability-ball hamstring curls instead.'
          },
          {
            name: 'Hip Thrust', target: 'Glutes', scheme: '3x10-12',
            how: 'With your upper back on a bench, drive your hips up until your body forms a straight line.',
            alt: 'No barbell or bench free? Do bodyweight Glute Bridges on the floor instead.'
          },
          {
            name: 'Seated Calf Raise', target: 'Calves', scheme: '3x15',
            how: 'With weight resting on your knees, rise onto your toes, pause, then lower slowly.',
            alt: 'No seated calf raise machine? Do Standing Calf Raises holding dumbbells instead.'
          }
        ]
      },
      {
        id: 'cardio', label: 'Cardio + Core', colorKey: 'cardio', subtitle: 'Conditioning',
        intro: '20–30 min moderate cardio (incline treadmill walk, cycling, or rowing), then 3 rounds of:',
        exercises: [
          {
            name: 'Plank', target: 'Core', scheme: '3x45s',
            how: 'Hold a straight line from head to heels, forearms on the floor, and brace your abs.',
            alt: 'Bodyweight only — always doable anywhere.'
          },
          {
            name: 'Leg Raises', target: 'Lower abs', scheme: '3x15',
            how: 'Lying on your back (or hanging from a bar), raise your legs with control, then lower without touching the floor.',
            alt: 'No pull-up bar for hanging raises? Do them lying on the floor instead.'
          },
          {
            name: 'Cable Crunches', target: 'Abs', scheme: '3x15',
            how: 'Kneeling in front of the cable stack, crunch down by curling your torso toward your hips.',
            alt: 'No cable machine free? Do regular floor crunches or bicycle crunches instead.'
          }
        ]
      }
    ];

    /* ==================================================================
       Accent colors per day type (static Tailwind classes — kept as
       complete literal strings so the Tailwind build can detect them)
       ================================================================== */
    const ACCENT = {
      upper: { text: 'text-upper', border: 'border-upper', soft: 'bg-upper-soft text-upper' },
      lower: { text: 'text-lower', border: 'border-lower', soft: 'bg-lower-soft text-lower' },
      cardio: { text: 'text-cardio', border: 'border-cardio', soft: 'bg-cardio-soft text-cardio' },
      ink: { text: 'text-ink', border: 'border-ink', soft: 'bg-neutral-100 text-ink' }
    };

    /* ==================================================================
       Small inline icon set (no emoji, no icon font, no network)
       ================================================================== */
    const ICONS = {
      close: '<svg viewBox="0 0 20 20" fill="none" class="h-4 w-4"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
      expand: '<svg viewBox="0 0 20 20" fill="none" class="h-3.5 w-3.5"><path d="M7 3H3v4M13 3h4v4M17 13v4h-4M3 13v4h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      download: '<svg viewBox="0 0 20 20" fill="none" class="h-3.5 w-3.5"><path d="M10 3v10m0 0l-4-4m4 4l4-4M4 16h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      upload: '<svg viewBox="0 0 20 20" fill="none" class="h-3.5 w-3.5"><path d="M10 13V3m0 0L6 7m4-4l4 4M4 16h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" class="h-6 w-6"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    /* ==================================================================
       Local gif lookup — no network calls, no external exercise API.
       Exercise names and actual asset filenames occasionally differ,
       so we try a small set of likely matches before falling back to
       a placeholder automatically.
       ================================================================== */
    const GIF_ALIASES = {
      'Face Pull': ['Face pull.jpg', 'Face Pull.gif'],
      'Leg Extension (machine)': ['Leg Extension.gif', 'Leg Extension (machine).gif'],
      'Pull-Ups / Lat Pulldown': ['Lat Pulldown.gif', 'Pull-Ups / Lat Pulldown.gif', 'Pull-Ups.gif', 'Pull-Ups.jpg', 'Pull Ups.gif', 'Pull Ups.jpg'],
      'Bicep Curl (Barbell or Dumbbell)': ['Bicep Curl.gif', 'Bicep Curl (Barbell or Dumbbell).gif'],
      'Seated Leg Curl': ['Seated Leg Curl.jpg', 'Seated Leg Curl.gif']
    };

    function gifCandidates(name) {
      const aliases = GIF_ALIASES[name] || [];
      const candidates = [...aliases];

      const baseNames = [
       name,
       name.replace(/\s*\([^)]*\)/g, '').trim(),
       name.replace(/-/g, ' '),
       name.replace(/-/g, ' ').replace(/\s*\([^)]*\)/g, '').trim(),
       name.toLowerCase(),
       name.toLowerCase().replace(/\s*\([^)]*\)/g, '').trim(),
      ];

      for (const baseName of baseNames) {
       if (!baseName) continue;
       const withExts = ['.gif', '.jpg'];
       for (const ext of withExts) {
         const value = `${baseName}${ext}`;
         if (!candidates.includes(value)) candidates.push(value);
       }
      }

      return candidates
       .filter(Boolean)
       .map(fileName => 'gifs/' + encodeURIComponent(fileName));
    }

    function handleGifError(img) {
      const candidates = JSON.parse(img.dataset.gifCandidates || '[]');
      const currentIndex = candidates.indexOf(img.getAttribute('src'));
      const next = candidates[currentIndex + 1];

      if (next) {
       img.src = next;
       return;
      }

      const thumb = img.closest('[data-thumb]');
      if (thumb) thumb.classList.add('gif-missing');
    }

    function gifSrc(name) {
      const candidates = gifCandidates(name);
      return candidates[0] || ('gifs/' + encodeURIComponent(name) + '.gif');
    }

    function cardThumbHtml(name) {
      const candidates = JSON.stringify(gifCandidates(name));
      return `
       <img src="${gifSrc(name)}" alt="${name}" loading="lazy" data-gif-candidates='${candidates}' class="h-full w-full object-cover" onerror="handleGifError(this)">
       <span class="absolute bottom-1 right-1 rounded-md bg-black/55 p-1 text-white">${ICONS.expand}</span>
       <div class="absolute inset-0 hidden flex-col items-center justify-center gap-1 bg-neutral-100 px-2 text-center text-muted" data-placeholder>
         ${ICONS.image}
         <span class="text-[0.68rem] leading-tight">Add gif</span>
       </div>`;
    }

    function modalMediaHtml(name) {
      const candidates = JSON.stringify(gifCandidates(name));
      return `
       <div class="relative mb-3.5 overflow-hidden rounded-2xl border border-line bg-neutral-100" data-thumb>
         <img src="${gifSrc(name)}" alt="${name}" data-gif-candidates='${candidates}' class="max-h-80 w-full object-contain" onerror="handleGifError(this)">
         <div class="hidden flex-col items-center justify-center gap-1.5 px-4 py-10 text-center text-muted" data-placeholder>
           ${ICONS.image}
           <span class="text-xs leading-tight">Add gifs/${name}.gif to see the demo</span>
         </div>
       </div>`;
    }

    /* ==================================================================
       Storage — plain localStorage, fully offline and persistent
       ================================================================== */
    function loadLog() {
      try {
        return JSON.parse(localStorage.getItem('workout-log') || '[]');
      } catch (e) {
        return [];
      }
    }
    function saveLog(log) {
      try {
        localStorage.setItem('workout-log', JSON.stringify(log));
      } catch (e) {
        console.error('Could not save workout log:', e);
      }
    }
    function todayISO() { return new Date().toISOString().slice(0, 10); }

    function addSet(dayId, exName, weight, reps) {
      const log = loadLog();
      log.push({
        id: Date.now() + Math.random().toString(36).slice(2, 7),
        date: todayISO(), day: dayId, exercise: exName,
        weight: weight || '-', reps: reps || '-'
      });
      saveLog(log);
      render();
    }
    function deleteSet(id) {
      saveLog(loadLog().filter(e => e.id !== id));
      render();
    }
    function clearAllLogs() {
      if (!confirm('Clear your entire workout history? This cannot be undone.')) return;
      saveLog([]);
      render();
    }
    function exportLogs() {
      const blob = new Blob([JSON.stringify(loadLog(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `workout-log-${todayISO()}.json`; a.click();
      URL.revokeObjectURL(url);
    }
    function importLogsFile(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error('not an array');
          const existing = loadLog();
          const merged = existing.concat(imported.filter(im => !existing.some(ex => ex.id === im.id)));
          saveLog(merged);
          render();
        } catch (err) {
          alert("Could not read that file — make sure it's a backup exported from this page.");
        }
      };
      reader.readAsText(file);
    }

    /* ==================================================================
       Nav / routing
       ================================================================== */
    const navEl = document.getElementById('nav');
    const mainEl = document.getElementById('main');
    const overlay = document.getElementById('overlay');
    const modal = document.getElementById('modal');

    let currentTab = 'upperA';
    const TABS = [...PROGRAM.map(d => ({ id: d.id, label: d.label, colorKey: d.colorKey })), { id: 'history', label: 'History', colorKey: 'ink' }];

    function buildNav() {
      navEl.innerHTML = TABS.map(t => {
        const accent = ACCENT[t.colorKey];
        const active = currentTab === t.id;
        const cls = active
          ? `${accent.text} border-b-2 ${accent.border}`
          : 'border-b-2 border-transparent text-muted hover:text-ink';
        return `<button data-tab="${t.id}" class="cursor-pointer whitespace-nowrap px-4 py-3 text-base font-extrabold uppercase tracking-tight transition-colors ${cls}">${t.label}</button>`;
      }).join('');
      navEl.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => { currentTab = btn.dataset.tab; render(); });
      });
    }

    function render() {
      buildNav();
      if (currentTab === 'history') { renderHistory(); return; }
      const day = PROGRAM.find(d => d.id === currentTab);
      renderDay(day);
    }

    /* ==================================================================
       Day view
       ================================================================== */
    function cssId(name) { return name.replace(/[^a-z0-9]/gi, '_'); }

    function exerciseCard(day, ex, log, today) {
      const accent = ACCENT[day.colorKey];
      const todaysSets = log.filter(e => e.day === day.id && e.exercise === ex.name && e.date === today);
      const setsHtml = todaysSets.map(e => `
        <span class="inline-flex items-center gap-1.5 rounded-full bg-good px-2.5 py-1 text-xs font-mono text-white">
          ${e.weight}${e.weight !== '-' ? ' kg' : ''} × ${e.reps}
          <button onclick="deleteSet('${e.id}')" class="cursor-pointer opacity-80 hover:opacity-100" aria-label="Delete set">${ICONS.close}</button>
        </span>`).join('');

      return `
      <div class="mb-3.5 overflow-hidden rounded-2xl border border-line bg-white">
        <div class="flex flex-col gap-3.5 p-4 sm:flex-row">
          <div class="relative h-[170px] w-full shrink-0 cursor-pointer overflow-hidden rounded-xl border border-line bg-neutral-100 sm:h-24 sm:w-24" data-thumb onclick='openModal(${JSON.stringify(ex.name)})'>
            ${cardThumbHtml(ex.name)}
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <h3 class="text-base font-bold">${ex.name}</h3>
              <span class="rounded-full ${accent.soft} px-2 py-0.5 font-mono text-xs font-medium">${ex.scheme}</span>
            </div>
            <div class="mb-1.5 mt-1 text-xs text-muted">${ex.target}</div>
            <p class="mb-1.5 text-sm leading-relaxed text-neutral-700">${ex.how}</p>
            <div class="mt-1.5 rounded-md border-l-[3px] ${accent.border} bg-neutral-50 px-2.5 py-1.5 text-xs text-muted">
              <b class="font-semibold text-ink">No equipment?</b> ${ex.alt}
            </div>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2 border-t border-line bg-neutral-50 px-4 py-2.5">
          <input type="number" step="0.5" placeholder="kg" id="w-${cssId(ex.name)}" class="no-spinner w-[76px] rounded-lg border border-line px-2.5 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-ink/15">
          <input type="number" placeholder="reps" id="r-${cssId(ex.name)}" class="no-spinner w-[76px] rounded-lg border border-line px-2.5 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-ink/15">
          <button onclick='submitSet(${JSON.stringify(day.id)}, ${JSON.stringify(ex.name)})' class="cursor-pointer rounded-lg bg-ink px-3.5 py-2 text-xs font-semibold text-white hover:opacity-85">+ Add set</button>
          <div class="ml-auto flex flex-wrap gap-1.5">${setsHtml}</div>
        </div>
      </div>`;
    }

    function renderDay(day) {
      const log = loadLog();
      const today = todayISO();
      const accent = ACCENT[day.colorKey];

      let html = `
        <div class="mb-1.5 flex flex-wrap items-baseline justify-between gap-2">
          <h2 class="${accent.text} text-3xl font-black uppercase tracking-tight">${day.label}</h2>
          <span class="text-sm text-muted">${day.subtitle}</span>
        </div>`;

      if (day.intro) {
        html += `<div class="mb-4 rounded-2xl border border-line bg-white px-4 py-3.5 text-sm text-muted">${day.intro}</div>`;
      }

      const loggedTodayCount = day.exercises.filter(ex =>
        log.some(e => e.day === day.id && e.exercise === ex.name && e.date === today)
      ).length;
      html += `<div class="mb-4 text-sm text-muted"><strong class="font-semibold text-ink">${loggedTodayCount}/${day.exercises.length}</strong> exercises logged today</div>`;

      html += day.exercises.map(ex => exerciseCard(day, ex, log, today)).join('');

      mainEl.innerHTML = html;
    }

    function submitSet(dayId, exName) {
      const w = document.getElementById('w-' + cssId(exName)).value;
      const r = document.getElementById('r-' + cssId(exName)).value;
      if (!r) { alert('Enter at least how many reps you did.'); return; }
      addSet(dayId, exName, w, r);
    }

    /* ==================================================================
       History view
       ================================================================== */
    function renderHistory() {
      const log = loadLog();
      const sorted = [...log].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));

      let html = `
        <div class="mb-4 flex flex-wrap gap-2.5">
          <button onclick="exportLogs()" class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg border border-line bg-white px-3.5 py-2 text-sm font-semibold hover:bg-neutral-100">${ICONS.download} Export backup</button>
          <label class="inline-block">
            <input type="file" accept="application/json" class="hidden" onchange="importLogsFile(this)">
            <button type="button" onclick="this.previousElementSibling.click()" class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg border border-line bg-white px-3.5 py-2 text-sm font-semibold hover:bg-neutral-100">${ICONS.upload} Import backup</button>
          </label>
          <button onclick="clearAllLogs()" class="cursor-pointer rounded-lg border border-red-200 px-3.5 py-2 text-sm font-semibold text-red-600 hover:bg-red-50">Clear all history</button>
        </div>`;

      if (sorted.length === 0) {
        html += `<div class="py-10 text-center text-sm text-muted">No sets logged yet. Go log your first workout!</div>`;
      } else {
        html += `<div class="overflow-hidden rounded-2xl border border-line">
          <table class="w-full border-collapse text-sm">
            <thead>
              <tr class="bg-neutral-100 text-left text-xs font-bold uppercase tracking-wide text-muted">
                <th class="px-3 py-2.5">Date</th><th class="px-3 py-2.5">Day</th><th class="px-3 py-2.5">Exercise</th><th class="px-3 py-2.5">Weight</th><th class="px-3 py-2.5">Reps</th><th class="px-3 py-2.5"></th>
              </tr>
            </thead>
            <tbody>`;
        html += sorted.map(e => {
          const dayLabel = (PROGRAM.find(d => d.id === e.day) || {}).label || e.day;
          return `<tr class="border-t border-line">
            <td class="px-3 py-2.5 font-mono">${e.date}</td>
            <td class="px-3 py-2.5">${dayLabel}</td>
            <td class="px-3 py-2.5">${e.exercise}</td>
            <td class="px-3 py-2.5 font-mono">${e.weight}</td>
            <td class="px-3 py-2.5 font-mono">${e.reps}</td>
            <td class="px-3 py-2.5"><button onclick="deleteSet('${e.id}')" class="cursor-pointer text-red-600 hover:opacity-70" aria-label="Delete entry">${ICONS.close}</button></td>
          </tr>`;
        }).join('');
        html += `</tbody></table></div>`;
      }

      mainEl.innerHTML = html;
    }

    /* ==================================================================
       Modal (exercise demo + instructions)
       ================================================================== */
    function openModal(exName) {
      let ex = null;
      for (const d of PROGRAM) {
        const f = d.exercises.find(e => e.name === exName);
        if (f) { ex = f; break; }
      }
      if (!ex) return;

      modal.innerHTML = `
        <button onclick="closeModal()" class="absolute right-3.5 top-3.5 cursor-pointer rounded-lg p-1.5 text-muted hover:bg-neutral-100" aria-label="Close">${ICONS.close}</button>
        ${modalMediaHtml(ex.name)}
        <h2 class="mb-1 text-xl font-bold">${ex.name}</h2>
        <div class="mb-3 text-xs text-muted">${ex.target} · ${ex.scheme}</div>
        <p class="mb-1.5 text-sm leading-relaxed text-neutral-700">${ex.how}</p>
        <div class="mt-1.5 rounded-md border-l-[3px] border-ink bg-neutral-50 px-2.5 py-1.5 text-xs text-muted">
          <b class="font-semibold text-ink">No equipment?</b> ${ex.alt}
        </div>`;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }
    function closeModal() {
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      modal.innerHTML = '';
    }
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ==================================================================
       Init
       ================================================================== */
    render();
  </script>
</body>

</html>
